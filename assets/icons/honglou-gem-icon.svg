<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- 滤镜：柔和外发光与浮雕阴影 -->
    <filter id="jadeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#593b04" flood-opacity="0.8"/>
    </filter>

    <!-- 渐变：帝王金金镶玉边框 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="25%" stop-color="#e5b842" />
      <stop offset="50%" stop-color="#caa035" />
      <stop offset="75%" stop-color="#fdf0a6" />
      <stop offset="100%" stop-color="#8a6114" />
    </linearGradient>

    <!-- 渐变：内圈细金边 -->
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4c9" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a721d" />
    </linearGradient>

    <!-- 渐变：通灵朱玉底色 (朱砂与胭脂温润微光) -->
    <radialGradient id="vermilionJade" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#e03e3e" />
      <stop offset="35%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#881313" />
      <stop offset="100%" stop-color="#4c0505" />
    </radialGradient>

    <!-- 渐变：玉石表面通灵光斑 -->
    <radialGradient id="jadeSheen" cx="35%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#fca5a5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0" />
    </radialGradient>

    <!-- 渐变：朱红绳结 -->
    <linearGradient id="cordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- 渐变：红字烫金质感 -->
    <linearGradient id="charGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffea9f" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#6b4c05" />
    </linearGradient>
  </defs>

  <!-- 1. 顶部吉祥丝绦绳结与金珠穿环 -->
  <g id="tassel-top">
    <!-- 穿玉丝绦 -->
    <path d="M 64 2 Q 64 12 64 20" stroke="url(#cordGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- 同心纽结 -->
    <ellipse cx="64" cy="11" rx="9" ry="4" fill="url(#cordGrad)" stroke="#5c0606" stroke-width="0.8" />
    <circle cx="64" cy="11" r="2.5" fill="#fef08a" stroke="#8a6114" stroke-width="0.8" />
    <!-- 金佩环 (镶嵌宝玉的提梁金环) -->
    <path d="M 54 22 C 54 15, 74 15, 74 22 C 74 25, 54 25, 54 22 Z" fill="url(#goldGrad)" stroke="#593b04" stroke-width="0.8" />
  </g>

  <!-- 2. 外层金镶玉宝玉轮廓 (通灵宝玉佩体：如意方圆弧璧) -->
  <!-- 投影阴影 -->
  <path d="M 34 22 
           C 44 19, 84 19, 94 22 
           C 114 26, 120 46, 118 70 
           C 116 96, 102 118, 64 122 
           C 26 118, 12 96, 10 70 
           C 8 46, 14 26, 34 22 Z"
        fill="#000000" opacity="0.4" transform="translate(0, 3)" />

  <!-- 金镶玉外缘金身 -->
  <path d="M 34 22 
           C 44 19, 84 19, 94 22 
           C 114 26, 120 46, 118 70 
           C 116 96, 102 118, 64 122 
           C 26 118, 12 96, 10 70 
           C 8 46, 14 26, 34 22 Z"
        fill="url(#goldGrad)" 
        stroke="#6b4c05" 
        stroke-width="1.2" />

  <!-- 金饰如意回纹与祥云提梁雕花 -->
  <!-- 左上如意耳云纹 -->
  <path d="M 22 34 C 18 28, 28 24, 34 27 C 32 32, 24 35, 22 34 Z" fill="#ffeaa7" opacity="0.8" />
  <!-- 右上如意耳云纹 -->
  <path d="M 106 34 C 110 28, 100 24, 94 27 C 96 32, 104 35, 106 34 Z" fill="#ffeaa7" opacity="0.8" />

  <!-- 3. 朱砂温润玉芯主体 -->
  <path d="M 36 26 
           C 46 23, 82 23, 92 26 
           C 108 30, 113 48, 111 70 
           C 109 92, 97 112, 64 116 
           C 31 112, 19 92, 17 70 
           C 15 48, 20 30, 36 26 Z"
        fill="url(#vermilionJade)" 
        stroke="#350202" 
        stroke-width="0.8" />

  <!-- 4. 玉石内部双金线暗纹圈框 (古典宫璧锦带纹) -->
  <path d="M 39 30 
           C 48 27, 80 27, 89 30 
           C 102 34, 106 50, 104 70 
           C 102 89, 92 106, 64 110 
           C 36 106, 26 89, 24 70 
           C 22 50, 26 34, 39 30 Z"
        fill="none" 
        stroke="url(#goldGrad2)" 
        stroke-width="1.2" 
        stroke-dasharray="3,1.5" 
        opacity="0.85" />

  <!-- 玉质莹润高光 Sheen -->
  <path d="M 36 26 
           C 46 23, 82 23, 92 26 
           C 104 29, 109 42, 107 58 
           C 95 40, 75 32, 45 35 
           C 30 36, 22 44, 18 56 
           C 17 44, 23 30, 36 26 Z"
        fill="url(#jadeSheen)" />

  <!-- 5. 祥云瑞气浮雕纹 (玉佩四角微雕) -->
  <g stroke="url(#goldGrad2)" stroke-width="1" fill="none" opacity="0.65" stroke-linecap="round">
    <!-- 顶部中央如意云头 -->
    <path d="M 58 29 C 58 25, 64 25, 64 28 C 64 25, 70 25, 70 29" />
    <!-- 底部祥云托珠 -->
    <path d="M 56 106 C 60 109, 68 109, 72 106" />
    <circle cx="64" cy="107" r="1.5" fill="#fef08a" stroke="none" />
  </g>

  <!-- 6. 核心图腾：古典金石小篆“红”字（笔画精修金嵌，融通灵宝玉精髓） -->
  <g filter="url(#goldShine)" fill="url(#charGold)">
    <!-- 篆书“红”左侧“糸”旁 (绞丝云篆) -->
    <!-- 顶部如意绳结头 -->
    <circle cx="46" cy="45" r="3.2" />
    
    <!-- 上折丝环 -->
    <path d="M 45 48 
             C 41 53, 37 57, 42 61 
             C 46 64, 52 58, 48 53 
             C 45 49, 44 48, 45 48 Z" />
    
    <!-- 下折丝环 -->
    <path d="M 42 62 
             C 36 67, 33 73, 39 77 
             C 45 80, 50 74, 46 69 
             C 43 65, 42 63, 42 62 Z" />
    
    <!-- 底部三缕垂丝丝绦 -->
    <path d="M 37 81 C 36 87, 33 93, 31 96 C 33 96, 35 91, 39 84 Z" />
    <path d="M 42 81 C 42 87, 42 93, 41 97 C 43 97, 44 91, 44 83 Z" />
    <path d="M 46 80 C 48 85, 51 91, 54 95 C 54 93, 50 87, 48 82 Z" />

    <!-- 篆书“红”右侧“工”部 (金石鼎立端严之姿) -->
    <!-- 上横 (典雅微拱覆云横) -->
    <path d="M 61 49 
             C 69 46, 79 46, 87 49 
             C 88 51, 85 53, 83 52 
             C 77 50, 71 50, 65 52 
             C 63 53, 60 51, 61 49 Z" />
             
    <!-- 中竖 (悬针挺秀) -->
    <path d="M 72 49 
             C 74 49, 75 51, 74.5 54 
             L 74.5 83 
             C 75 86, 74 88, 72 88 
             C 70 88, 69 86, 69.5 83 
             L 69.5 54 
             C 69 51, 70 49, 72 49 Z" />
             
    <!-- 下横 (承载乾坤之基) -->
    <path d="M 59 87 
             C 67 85, 81 85, 89 87 
             C 90 89, 87 91, 85 90 
             C 78 88, 70 88, 63 90 
             C 61 91, 58 89, 59 87 Z" />
             
    <!-- 宝玉灵石核心画龙点睛：灵珠光芒 -->
    <circle cx="72" cy="68" r="2.8" fill="#ffffff" opacity="0.85" />
    <circle cx="72" cy="68" r="1.5" fill="#fef08a" />
  </g>

  <!-- 7. 四方微雕装饰小红星/金珠点缀 -->
  <circle cx="28" cy="70" r="1.5" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="100" cy="70" r="1.5" fill="url(#goldGrad)" opacity="0.7"/>
</svg>